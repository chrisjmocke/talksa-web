  <style>
    :root {
      --bg-dark: #0b1020;
      --bg-mid: #111b2e;
      --accent: #f59e0b;
      --accent-strong: #f97316;
      --card: rgba(15, 23, 42, 0.86);
      --line: rgba(148, 163, 184, 0.28);
      --text: #e5eefb;
      --muted: #bfd0ef;
      --brand: #7dd3fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1a2944 0%, var(--bg-dark) 35%, #070d1a 100%);
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .maintenance-shell {
      width: min(92vw, 760px);
      text-align: center;
    }

    .maintenance-banner {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      color: #111827;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.35);
      margin-bottom: 1.5rem;
      font-size: 0.78rem;
    }

    .maintenance-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 30px 60px rgba(2, 6, 23, 0.5);
      backdrop-filter: blur(8px);
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.08);
      margin-bottom: 1rem;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--brand);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.9);
    }

    .brand-name {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--brand);
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    h1 {
      margin: 0 0 0.9rem;
      font-size: clamp(2.1rem, 4vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0 auto 1.5rem;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .status-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(148, 163, 184, 0.04);
      padding: 1rem 1.2rem;
      margin: 1.25rem auto 1.5rem;
      max-width: 500px;
    }

    .status-box p {
      margin: 0.45rem 0;
      color: var(--text);
    }

    .contact-block {
      margin-top: 0.75rem;
      color: var(--muted);
    }

    .contact-block p {
      margin: 0 0 0.45rem;
    }

    .contact-block a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .maintenance-card {
        padding: 1.5rem 1rem;
      }

      .maintenance-banner {
        letter-spacing: 0.1em;
        font-size: 0.7rem;
      }
    }
  </style>
