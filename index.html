<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Talk – Scheduled Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('assets/letstalkmainblack.png');
            background-size: cover;
            background-position: center;
            background-color: #000000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px 20px;
            border-radius: 12px;
            max-width: 480px;
            width: 90%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 15px;
            color: #9e9e9e;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #4caf50;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>We're Upgrading Let's Talk</h1>
        <p>Our backend systems are currently undergoing scheduled maintenance and updates to bring you an improved experience. The app and web service will be back online shortly.</p>
        <div class="badge">Maintenance in Progress</div>
    </div>
</body>
</html>
